[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dex-contact-reconstruction-analysis"
version = "0.1.0"
description = "Independent C2Dex reconstruction and successful-pickup contact analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.13", "matplotlib>=3.7", "h5py>=3.8"]

[project.optional-dependencies]
reconstruction = ["torch>=2.2", "trimesh>=4", "rtree>=1"]
robot = ["mujoco>=3.3"]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["screwdriver_assembly_contract"]

[tool.setuptools.packages.find]
include = ["analysis*", "perception*", "retarget*", "eval*", "rl*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests", "eval/checks"]
